---
layout: default
---
<article class="max-w-3xl mx-auto">
    <header class="mb-10">
        <a href="/blog/" class="text-sm text-blue-700 hover:underline mono">&larr; All posts</a>
        <h1 class="text-4xl md:text-5xl font-bold text-gray-800 mt-6 mb-4 leading-tight">{{ page.title }}</h1>
        <p class="text-gray-600 mono text-sm">
            <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time>
        </p>
    </header>

    <div class="post-content">
        {{ content }}
    </div>
</article>
